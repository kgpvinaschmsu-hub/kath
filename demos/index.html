<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive coded concept from Kath's design and development portfolio.">
  <meta name="theme-color" content="#f4eee5">
  <title>Interactive Project Demo — Kath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .palette-options{display:flex;gap:12px}.palette-swatch{width:38px;height:38px;border:3px solid white;outline:1px solid var(--line);border-radius:50%;background:#bd6547}.palette-swatch.olive{background:#667153}.palette-swatch.blue{background:#52728a}.palette-swatch.active{outline:3px solid var(--ink)}
    .design-tokens{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:15px 0}.token-card{display:flex;flex-direction:column;gap:7px;padding:18px;background:white;border:1px solid var(--line)}.token-card>span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.token-card small{font-size:9px;color:var(--muted)}.token-heading{font-size:35px;line-height:1.1;letter-spacing:-.08em}.spacing-bars{height:36px;display:flex;align-items:end;gap:5px}.spacing-bars i{width:18px;background:var(--olive);height:10px}.spacing-bars i:nth-child(2){height:17px}.spacing-bars i:nth-child(3){height:25px}.spacing-bars i:nth-child(4){height:33px}
    .preview-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.preview-controls>span{font-size:10px;color:var(--muted)}.lab-primary,.lab-secondary{border:0;padding:11px 15px;font-size:10px;font-weight:800;border-radius:var(--lab-radius,3px);transition:.2s}.lab-primary{background:var(--lab-accent,#bd6547);color:white}.lab-secondary{background:color-mix(in srgb,var(--lab-accent,#bd6547) 15%,white);color:var(--lab-accent,#bd6547)}.component-preview.square-corners .lab-primary,.component-preview.square-corners .lab-secondary{border-radius:0}.component-preview .secondary[aria-pressed="true"]{background:var(--olive);color:white}.view-controls{display:flex;gap:6px}
    .playground-frame{min-height:250px;padding:18px;background:linear-gradient(135deg,#efe0d2,#dce2d5);display:grid;place-items:center;transition:.25s}.playground-frame.mobile{padding:20px;max-width:290px;min-height:390px;margin:auto;border:7px solid #292721;border-radius:26px}.playground-card{width:100%;max-width:520px;padding:27px;background:#fffaf3;box-shadow:0 12px 35px rgba(40,37,32,.12)}.playground-kicker{font-size:8px;font-weight:800;letter-spacing:.14em;color:var(--accent)}.playground-card h3{font-size:25px;line-height:1.15;letter-spacing:-.05em;margin:12px 0 8px}.playground-card p{font-size:11px;color:var(--muted);margin:0 0 17px}.playground-card>span:last-child{display:block;margin-top:12px;font-size:9px;color:var(--muted)}
    .portfolio-intro{display:flex;align-items:end;justify-content:space-between;gap:18px;padding:22px;background:#e8dfd2;margin-bottom:18px}.portfolio-intro .eyebrow{display:block;margin:0 0 8px;font-size:8px}.portfolio-intro h3{font-size:23px;line-height:1.15;letter-spacing:-.04em;margin:0}.portfolio-contact{white-space:nowrap}.portfolio-grid{grid-template-columns:repeat(2,1fr)}.portfolio-card{padding:0;text-align:left;color:var(--ink);font-family:var(--font)}.portfolio-card[hidden]{display:none}.portfolio-card .portfolio-art{height:130px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:15px;font-size:28px;font-weight:800;color:rgba(40,37,32,.75)}.portfolio-card:nth-child(3n) .portfolio-art{background:linear-gradient(145deg,#ead5c9,#c88e73)}.portfolio-art small{font-size:8px;letter-spacing:.12em}.portfolio-card .gallery-body{display:flex;flex-direction:column;align-items:flex-start;gap:6px}.portfolio-card .gallery-body strong{font-size:11px}.portfolio-card .gallery-body span{font-size:9px;color:var(--muted);font-weight:400}.portfolio-card .gallery-body em{font-size:9px;font-style:normal;font-weight:800;color:var(--accent);margin-top:3px}.portfolio-card:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(56,42,29,.1)}.portfolio-modal{position:fixed;inset:0;background:rgba(30,27,23,.72);display:grid;place-items:center;padding:20px;z-index:20}.portfolio-modal[hidden]{display:none}.portfolio-dialog{position:relative;width:min(470px,100%);padding:34px;background:var(--cream)}.portfolio-dialog>button{position:absolute;right:14px;top:10px;border:0;background:transparent;font-size:22px}.portfolio-dialog h3{font-size:25px;margin:0 0 8px}.portfolio-dialog p{font-size:12px;color:var(--muted)}
    @media(max-width:560px){.design-tokens{grid-template-columns:1fr}.portfolio-grid{grid-template-columns:1fr}.portfolio-intro{align-items:flex-start;flex-direction:column}.playground-frame.mobile{margin-left:auto;margin-right:auto}}
  </style>
</head>
<body>
  <header class="demo-header">
    <a class="brand" href="../"><span>K</span>Kath.</a>
    <span class="concept-label">Interactive concept demo</span>
    <a class="back-link" href="../#projects">← Back to portfolio</a>
  </header>

  <main>
    <section class="intro">
      <div>
        <p class="eyebrow" id="project-type">Project demo</p>
        <h1 id="project-title">Loading project…</h1>
      </div>
      <p id="project-summary">A browser-based concept created with HTML, CSS, and JavaScript.</p>
    </section>

    <section class="demo-shell" aria-label="Interactive project demo">
      <aside class="demo-sidebar">
        <div class="mini-brand" id="mini-brand">K</div>
        <nav id="demo-nav" aria-label="Demo navigation"></nav>
        <span class="demo-year">Kath · 2026</span>
      </aside>
      <div class="demo-workspace" id="demo-workspace" aria-live="polite"></div>
    </section>

    <section class="demo-footer">
      <div><span>Built with</span><strong>Semantic HTML · Responsive CSS · Vanilla JavaScript</strong></div>
      <a href="https://github.com/kgpvinaschmsu-hub/kath/tree/main/demos" target="_blank" rel="noopener noreferrer">View source code ↗</a>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
